<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1a6b"/>
      <stop offset="50%" style="stop-color:#c8a832"/>
      <stop offset="100%" style="stop-color:#4a1a6b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a832"/>
      <stop offset="40%" style="stop-color:#f0d060"/>
      <stop offset="70%" style="stop-color:#e0c040"/>
      <stop offset="100%" style="stop-color:#c8a832"/>
    </linearGradient>
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="280">
        <animate attributeName="width" from="0" to="800" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <style>
      @keyframes scanline {
        0% { transform: translateY(-4px); }
        100% { transform: translateY(280px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.3; }
        94% { opacity: 1; }
        96% { opacity: 0.5; }
        97% { opacity: 1; }
      }
      @keyframes glitchShift {
        0%, 100% { transform: translate(0, 0); }
        85% { transform: translate(0, 0); }
        86% { transform: translate(-3px, 1px); }
        87% { transform: translate(3px, -1px); }
        88% { transform: translate(0, 0); }
        95% { transform: translate(0, 0); }
        96% { transform: translate(2px, 0); }
        97% { transform: translate(-1px, 1px); }
        98% { transform: translate(0, 0); }
      }
      @keyframes fadeUp1 {
        0%, 60% { opacity: 0; transform: translateY(8px); }
        75% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp2 {
        0%, 68% { opacity: 0; transform: translateY(8px); }
        83% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp3 {
        0%, 76% { opacity: 0; transform: translateY(8px); }
        91% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .scanline {
        animation: scanline 3s linear infinite;
        opacity: 0.04;
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .main-title {
        animation: flicker 6s ease-in-out infinite, glitchShift 8s ease-in-out infinite;
      }
      .sub1 { animation: fadeUp1 3s ease-out forwards; opacity: 0; }
      .sub2 { animation: fadeUp2 3s ease-out forwards; opacity: 0; }
      .sub3 { animation: fadeUp3 3s ease-out forwards; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="12" fill="#0a0a0f"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a2e" stroke-width="0.3"/>
  </pattern>
  <rect width="800" height="280" rx="12" fill="url(#grid)" opacity="0.5"/>

  <!-- Border glow -->
  <rect x="1" y="1" width="798" height="278" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Terminal title bar -->
  <rect x="0" y="0" width="800" height="32" rx="12" fill="#141420"/>
  <rect x="0" y="20" width="800" height="12" fill="#141420"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f57" opacity="0.8"/>
  <circle cx="38" cy="16" r="5" fill="#febc2e" opacity="0.8"/>
  <circle cx="56" cy="16" r="5" fill="#28c840" opacity="0.8"/>
  <text x="400" y="20" font-family="'Courier New',monospace" font-size="11" fill="#6b6b8a" text-anchor="middle">LouisGue@afklab ~ /home/LouisGue</text>

  <!-- Scanline effect (gold tint) -->
  <rect class="scanline" x="0" y="0" width="800" height="3" fill="#c8a832"/>

  <!-- Horizontal glitch lines (violet + gold) -->
  <rect x="0" y="95" width="800" height="1" fill="#7c3aed" opacity="0.08">
    <animate attributeName="y" values="95;110;80;95" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.15;0;0.08" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="120" width="800" height="1" fill="#c8a832" opacity="0.06">
    <animate attributeName="y" values="120;85;130;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0;0.12;0.06" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title with reveal + glitch -->
  <g clip-path="url(#reveal)">
    <g class="main-title">
      <!-- Glitch shadow: violet offset -->
      <text x="400" y="115" font-family="'Courier New',monospace" font-size="56" font-weight="bold" fill="#7c3aed" text-anchor="middle" opacity="0.3" dx="-3" dy="-2">LouisGue</text>
      <!-- Glitch shadow: gold offset -->
      <text x="400" y="115" font-family="'Courier New',monospace" font-size="56" font-weight="bold" fill="#f0d060" text-anchor="middle" opacity="0.2" dx="3" dy="2">LouisGue</text>
      <!-- Main text -->
      <text x="400" y="115" font-family="'Courier New',monospace" font-size="56" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glow)">LouisGue</text>
    </g>
  </g>

  <!-- Decorative brackets -->
  <text x="95" y="118" font-family="'Courier New',monospace" font-size="28" fill="#7c3aed" opacity="0.4">
    &lt;/
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="665" y="118" font-family="'Courier New',monospace" font-size="28" fill="#c8a832" opacity="0.4">
    /&gt;
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative dots -->
  <circle cx="155" cy="155" r="1.5" fill="#7c3aed" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="645" cy="155" r="1.5" fill="#c8a832" opacity="0.5">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Separator line with animated sweep -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#4a1a6b" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="200" x2="60" y2="200" stroke="#c8a832" stroke-width="1" opacity="0.8">
    <animate attributeName="x2" from="60" to="740" dur="1s" begin="1.8s" fill="freeze"/>
    <animate attributeName="opacity" from="0.8" to="0" dur="0.5s" begin="2.8s" fill="freeze"/>
  </line>

  <!-- Subtitles with staggered fade -->
  <g class="sub1">
    <text font-family="'Courier New',monospace" font-size="11.5" fill="url(#subtitleGrad)">
      <tspan x="60" y="222">&gt; Etudiant en Cybersecurite &amp; Informatique · Ynov Campus Rouen</tspan>
    </text>
  </g>
  <g class="sub2">
    <text font-family="'Courier New',monospace" font-size="11.5" fill="#a78bfa" opacity="0.7">
      <tspan x="60" y="242">&gt; Membre CyberFi · 1er prix FoxyHack 2026 (Prix de l'Audace)</tspan>
    </text>
  </g>
  <g class="sub3">
    <text font-family="'Courier New',monospace" font-size="11.5" fill="#c8a832" opacity="0.6">
      <tspan x="60" y="262">&gt; Homelab · Infra · Securite offensive &amp; defensive</tspan>
      <tspan dx="8" class="cursor" fill="#c8a832">&#x2588;</tspan>
    </text>
  </g>
</svg>
